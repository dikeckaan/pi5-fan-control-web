name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check locale files
        run: |
          python - <<'PY'
          import glob, json, re, sys
          en = json.load(open("static/i18n/en.json"))
          ph = lambda s: sorted(re.findall(r"\{\w+\}", s))
          bad = False
          for path in sorted(glob.glob("static/i18n/*.json")):
              data = json.load(open(path))
              missing = set(en) - set(data)
              extra = set(data) - set(en)
              wrong = [k for k in en if k in data and ph(en[k]) != ph(data[k])]
              if missing or extra or wrong:
                  bad = True
                  print(path, "missing:", sorted(missing), "extra:", sorted(extra), "placeholders:", wrong)
          sys.exit(bad)
          PY

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: dikeckaan/pi5-fan-control-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the Docker Hub description from README.md
        env:
          DOCKERHUB_REPO: dikeckaan/pi5-fan-control-web
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" | jq -r .token)
          curl -s -X PATCH https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/ \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT ${TOKEN}" \
            -d "$(jq -n --arg full_desc "$(cat README.md)" '{"full_description": $full_desc}')"
