services:
  fan-web:
    image: dikeckaan/pi5-fan-control-web:latest
    build: .
    container_name: fan-web
    restart: unless-stopped
    # Needed to write the fan level and thermal policy under /sys.
    privileged: true
    stop_grace_period: 15s
    ports:
      - "5000:5000"
    environment:
      TZ: Europe/Istanbul
      # Uncomment to require a password for the panel:
      # FAN_PASSWORD: change-me
    volumes:
      - ./data:/app/data
